# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types:
- pre-commit
- commit-msg
- pre-push
default_language_version:
    python: python3
repos:
-   repo: local
    hooks:
    -   id: add-license-headers
        name: add-license-headers
        entry: python nerfstudio/scripts/licensing/license_headers.py
        language: system
        files: '.*'
        pass_filenames: false
    -   id: commit-message-format
        name: commit-message-format
        entry: python nerfstudio/scripts/github/validate_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true
    -   id: bathy-pre-push-smoke
        name: bathy-pre-push-smoke
        entry: python nerfstudio/scripts/github/run_bathy_pre_push_smoke.py
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.12.2
    hooks:
    -   id: ruff
        types_or: [ python, pyi, jupyter ]
        args: [ --fix ]
        exclude: '^(scripts|1_BLENDER)/'
    -   id: ruff-format
        types_or: [ python, pyi, jupyter ]
        exclude: '^(scripts|1_BLENDER)/'
