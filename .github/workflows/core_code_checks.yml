name: Core Tests.

on:
  push:
    branches: [main, bathy-main, bathy-dev]
  pull_request:
    branches: [main, bathy-main, bathy-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.13'
      - uses: actions/cache@v3
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system --upgrade -e .[dev]
      - name: Run license checks
        run: |
          ./nerfstudio/scripts/licensing/license_headers.sh --check
      - name: Check notebook cell metadata
        run: |
          python ./nerfstudio/scripts/docs/add_nb_tags.py --check
      - name: Run Ruff Linter
        run: |
          ruff check docs/ nerfstudio/ tests/ --output-format=github
      - name: Run Ruff Formatter
        run: |
          ruff format docs/ nerfstudio/ tests/ --diff
      - name: Run Pyright
        run: |
          if [[ "${GITHUB_REF_NAME}" == "bathy-main" || "${GITHUB_REF_NAME}" == "bathy-dev" || "${GITHUB_BASE_REF}" == "bathy-main" || "${GITHUB_BASE_REF}" == "bathy-dev" ]]; then
            echo "Skipping Pyright on Bathy branches while Bathy type debt is being resolved."
          else
            pyright
          fi
      - name: Test with pytest
        run: |
          if [[ "${GITHUB_REF_NAME}" == "bathy-main" || "${GITHUB_REF_NAME}" == "bathy-dev" || "${GITHUB_BASE_REF}" == "bathy-main" || "${GITHUB_BASE_REF}" == "bathy-dev" ]]; then
            pytest \
              --deselect=tests/process_data/test_process_images.py::test_process_images_skip_colmap \
              --deselect=tests/process_data/test_process_images.py::test_process_images_recursively_skip_colmap
          else
            pytest
          fi
